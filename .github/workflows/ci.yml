name: CI / Build & Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set version
        id: version
        run: |
          BASE=$(sed -n 's/^version=//p' gradle.properties)
          echo "value=$BASE-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: ./gradlew --no-daemon clean build -Pversion=${{ steps.version.outputs.value }}
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$VERSION" "build/libs/todo-app-$VERSION.jar" --target "$GITHUB_SHA" --title "Release v$VERSION" --generate-notes
